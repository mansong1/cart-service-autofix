[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# Every statement and branch in src/ is exercised by the suite today, so the
# gate sits just below 100 rather than at some aspirational number nobody
# meets. Dropping below this means new logic arrived without tests.
fail_under = 90
show_missing = true
skip_covered = false
